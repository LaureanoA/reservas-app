
apiVersion: apps/v1
kind: Deployment

metadata:
  name: reservas-api
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.api.replicaCount }}

  selector:
    matchLabels:
      app: reservas-api

  template:
    metadata:
      labels:
        app: reservas-api

    spec:
      containers:
        - name: reservas-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"

          envFrom:
            - configMapRef:
                name: reservas-api-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_PASSWORD

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu | quote }}
              memory: {{ .Values.api.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu | quote }}
              memory: {{ .Values.api.resources.limits.memory | quote }}
