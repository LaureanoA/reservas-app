
apiVersion: v1
kind: Secret

metadata:
  name: reservas-db-secret
  namespace: {{ .Release.Namespace }}

type: Opaque

data:
  MYSQL_USER: {{ .Values.db.auth.user | b64enc | quote }}
  MYSQL_PASSWORD: {{ .Values.db.auth.password | b64enc | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.db.auth.rootPassword | b64enc | quote }}
