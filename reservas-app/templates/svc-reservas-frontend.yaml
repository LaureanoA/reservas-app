apiVersion: v1
kind: Service

metadata:
  name: reservas-frontend
  namespace: {{ .Release.Namespace }}

spec:
  type: NodePort

  selector:
    app: reservas-frontend

  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      nodePort: {{ .Values.frontend.service.nodePort }}
      protocol: TCP
