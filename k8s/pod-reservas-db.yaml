apiVersion: v1
kind: Pod
metadata:
  labels:
    run: reservas-db
  name: reservas-db
spec:
  containers:
  - image: mysql:8.4
    name: reservas-db

    env:
      - name: MYSQL_DATABASE
        value: reservasdb

      - name: MYSQL_USER
        value: reservas_user

      - name: MYSQL_PASSWORD
        value: change_me

      - name: MYSQL_ROOT_PASSWORD
        value: change_me_root

    ports:
      - containerPort: 3306
    
  dnsPolicy: ClusterFirst
  restartPolicy: Always
