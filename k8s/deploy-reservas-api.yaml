apiVersion: apps/v1
kind: Deployment

metadata:
  name: reservas-api
  namespace: reservas-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: reservas-api

  template:
    metadata:
      labels:
        app: reservas-api

    spec:
      containers:
        - name: reservas-api
          image: laureanoa/reservas-api:v1


          envFrom:
            - configMapRef:
                name: reservas-api-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_PASSWORD


          ports:
            - containerPort: 3000
