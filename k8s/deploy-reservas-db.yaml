apiVersion: apps/v1
kind: Deployment

metadata:
  name: reservas-db
  namespace: reservas-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: reservas-db

  template:
    metadata:
      labels:
        app: reservas-db

    spec:
      containers:
        - name: reservas-db
          image: mysql:8.4

          env:
            - name: MYSQL_DATABASE
              value: reservasdb

            - name: MYSQL_USER
              value: reservas_user

            - name: MYSQL_PASSWORD
              value: change_me

            - name: MYSQL_ROOT_PASSWORD
              value: change_me_root

          ports:
            - containerPort: 3306
