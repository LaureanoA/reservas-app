apiVersion: v1
kind: Pod
metadata:
  labels:
    run: reservas-api
  name: reservas-api

spec:
  containers:
    - name: reservas-api
      image: laureanoa/reservas-api:v1

      env:
        - name: PORT
          value: "3000"

        - name: DB_HOST
          value: "reservas-db"

        - name: DB_PORT
          value: "3306"

        - name: DB_NAME
          value: reservasdb

        - name: DB_USER
          value: reservas_user

        - name: DB_PASSWORD
          value: change_me

        - name: APP_VERSION
          value: v1

        - name: SEED_DEMO
          value: "true"

      ports:
        - containerPort: 3000

  restartPolicy: Always
