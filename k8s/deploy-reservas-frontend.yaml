apiVersion: apps/v1
kind: Deployment

metadata:
  name: reservas-frontend
  namespace: reservas-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: reservas-frontend

  template:
    metadata:
      labels:
        app: reservas-frontend

    spec:
      containers:
        - name: reservas-frontend
          image: laureanoa/reservas-frontend:v1

          env:
            - name: API_HOST
              value: reservas-api

            - name: API_PORT
              value: "3000"

          ports:
            - containerPort: 8080
