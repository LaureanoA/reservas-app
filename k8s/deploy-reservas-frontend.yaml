apiVersion: apps/v1
kind: Deployment

metadata:
  name: reservas-frontend
  namespace: reservas-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: reservas-frontend

  template:
    metadata:
      labels:
        app: reservas-frontend

    spec:
      containers:
        - name: reservas-frontend
          image: laureanoa/reservas-frontend:v1

          envFrom:
            - configMapRef:
                name: reservas-frontend-config

          ports:
            - containerPort: 8080
